name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  fast:
    name: Fast (lint + typecheck + test:ci:fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check generated-artifact boundary
        run: npm run workspace:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration (fast)
        run: npm run test:ci:fast

  slow:
    name: Slow (containerized integration)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Start containerized deps (SurrealDB + Ollama)
        run: npm run test:ci:slow:up
      - name: Run slow integration tests
        run: npm run test:ci:slow
      - name: Stop containers
        if: always()
        run: npm run test:ci:slow:down
