name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  fast:
    name: Fast (lint + typecheck + test:ci:fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check generated-artifact boundary
        run: npm run workspace:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration (fast)
        run: npm run test:ci:fast

  slow:
    name: Slow (containerized integration)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Start containerized deps (SurrealDB + Ollama)
        run: npm run test:ci:slow:up
      - name: Run slow integration tests
        run: npm run test:ci:slow
      - name: Stop containers
        if: always()
        run: npm run test:ci:slow:down

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history
        run: gitleaks git --config .gitleaks.toml --no-banner --redact --verbose .

  pii-scan:
    name: Corpus PII scan (Presidio)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Presidio
        run: |
          pip install presidio-analyzer==2.2.364
          python -m spacy download en_core_web_sm
      # Corpora derived from real memories or transcripts must be listed here.
      # The older synthetic fixtures (model-/think-benchmark) are not scanned.
      - name: Scan labeled corpora
        run: python scripts/pii-audit/presidio_scan.py fixtures/judge-benchmark
